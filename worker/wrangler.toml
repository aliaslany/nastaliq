name = "nastaliq-bot"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "nastaliq.startstar.ir/*", zone_name = "startstar.ir" }
]

